# Builds the Moonwave docs and publishes them to GitHub Pages.
# Settings > Pages, set Source to "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "Spray/init.luau"
      - "Spray/Preview.luau"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "moonwave.toml"
      - ".moonwave/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build with Moonwave
        run: npx --yes moonwave@1.4.2 build --code Spray/init.luau --code Spray/Preview.luau --out-dir build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
