[package]
name = "mastedore/spray"
description = "ParticleEmitters rendered as GUI. Plays an emitter's authored effect out of ImageLabels, with a scrubbable, deterministic clock."
version = "1.0.0"
license = "MPL-2.0"
authors = ["Mastedore"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
exclude = [
	"resources",
	"plugin",
	"plugin.project.json",
	"tests",
	"bench",
	"docs",
	"place.project.json",
	"test.project.json",
	"sourcemap.json",
	"moonwave.toml",
	".moonwave",
	".github",
	"build",
	"aftman.toml",
	"Packages",
	"DevPackages",
	"*.rbxl",
	"*.rbxlx",
	"*.rbxl.lock",
	"*.rbxlx.lock",
]

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"
